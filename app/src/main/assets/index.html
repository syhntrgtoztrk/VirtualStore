<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VirtualStore</title>
<style>
:root{--navy:#102044;--blue:#1473ea;--orange:#ff6b19;--bg:#f4f6fa;--line:#e4e8ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Arial,Helvetica,sans-serif}
header{background:#fff;padding:16px 14px 12px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:var(--orange)}
.iconbtn{width:38px;height:38px;border:0;background:#f2f5fa;border-radius:12px;font-size:19px;color:var(--navy)}
.search{display:flex;gap:8px;margin-top:13px}.search input{min-width:0;flex:1;height:48px;padding:0 15px;border:2px solid #e0a51b;border-radius:15px;background:#fff;font-size:16px;outline:none}.search button{height:48px;border:0;border-radius:15px;background:var(--blue);color:#fff;font-weight:800;padding:0 17px;font-size:15px}
main{padding:13px 12px 28px;max-width:900px;margin:auto}.hint{font-size:12px;color:#667085;margin:3px 2px 9px}
.stores{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.store{border:1px solid #e0e5ed;background:#fff;border-radius:13px;padding:7px 2px 6px;min-width:0;cursor:pointer;text-align:center}.store.active{border:2px solid var(--blue);padding:6px 1px;box-shadow:0 2px 8px #1473ea22}
.logo{width:38px;height:38px;margin:0 auto 4px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;overflow:hidden}.storelabel{font-size:9px;line-height:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#28334d}
.t-trendyol{background:#ff6000}.t-hepsi{background:#fff;color:#f56600;border:1px solid #eee}.t-amazon{background:#fff;color:#111;border:1px solid #eee}.t-n11{background:#6c35bd}.t-sahib{background:#ffd400;color:#111}.t-walmart{background:#0874d9}.t-costco{background:#fff;color:#1765a8;border:1px solid #ddd}.t-schwarz{background:#171717}.t-home{background:#f47b20}.t-aldi{background:#07509b}.t-kroger{background:#165fc0}.t-carrefour{background:#fff;color:#e52b35;border:1px solid #ddd}
.status{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:11px;font-size:12px;color:#667085}
.results{display:flex;flex-direction:column;gap:9px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;display:grid;grid-template-columns:68px 1fr auto;gap:10px;align-items:center;box-shadow:0 2px 8px #1020440a}
.pic{width:68px;height:68px;border-radius:11px;background:#eef2f8;object-fit:cover}.title{font-size:14px;font-weight:800;line-height:17px}.storeline{font-size:11px;color:#667085;margin-top:4px}.price{font-size:17px;font-weight:900;margin-top:4px}.rating{font-size:12px;color:#f59e0b;font-weight:800;margin-top:3px}.stock{font-size:10px;color:#16803c;margin-top:2px}.view{background:var(--orange);color:#fff;text-decoration:none;border-radius:10px;padding:9px 10px;font-size:12px;font-weight:800;white-space:nowrap}
@media(min-width:560px){.stores{grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand">Virtual<span>Store</span></div><button class="iconbtn" aria-label="Settings">⚙</button></div>
  <div class="search"><input id="q" value="iPhone 20W charger" placeholder="Search for a product..."><button onclick="search()">Search</button></div>
</header>
<main>
  <div class="hint">Tap a store icon to search only that store.</div>
  <div class="stores" id="stores"></div>
  <div class="status" id="status"></div>
  <div class="results" id="results"></div>
</main>
<script>
const stores=[
["All","ALL","t-amazon"],["Trendyol","ty","t-trendyol"],["Hepsiburada","HB","t-hepsi"],["Amazon","a","t-amazon"],["n11","n11","t-n11"],
["Sahibinden","S","t-sahib"],["Walmart","W","t-walmart"],["Costco Wholesale","C","t-costco"],["Schwarz Group","SG","t-schwarz"],
["The Home Depot","HD","t-home"],["Aldi","A","t-aldi"],["The Kroger Co.","K","t-kroger"],["Carrefour","C","t-carrefour"]
];
const data=[
["Apple 20W USB-C Power Adapter","Amazon","$18.99",4.8,"In stock","https://www.amazon.com/","a"],
["Apple 20W USB-C Power Adapter","Walmart","$19.97",4.7,"In stock","https://www.walmart.com/","W"],
["Apple 20W USB-C Power Adapter","Trendyol","₺799",4.7,"In stock","https://www.trendyol.com/","ty"],
["Apple 20W USB-C Power Adapter","Hepsiburada","₺829",4.6,"In stock","https://www.hepsiburada.com/","HB"],
["USB-C 20W Fast Charger","n11","₺429",4.5,"In stock","https://www.n11.com/","n11"],
["Apple 20W USB-C Power Adapter","Carrefour","€21.99",4.4,"In stock","https://www.carrefour.com/","C"],
["USB-C Fast Charger 20W","Sahibinden","₺350",4.2,"Seller listing","https://www.sahibinden.com/","S"]
];
const img="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="136" height="136"><rect width="136" height="136" rx="18" fill="#eef2f8"/><rect x="45" y="18" width="46" height="100" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><path d="M57 43h22M57 58h22" stroke="#1473ea" stroke-width="5" stroke-linecap="round"/><circle cx="68" cy="101" r="4" fill="#94a3b8"/></svg>`);
let active="All";
function logoClass(s){return s[2]}
function renderStores(){
 document.getElementById("stores").innerHTML=stores.map(s=>`<button class="store ${s[0]===active?'active':''}" onclick="active='${s[0].replaceAll("'","\\'")}';renderStores();search()"><div class="logo ${logoClass(s)}">${s[1]}</div><div class="storelabel">${s[0]}</div></button>`).join("");
}
function search(){
 const q=document.getElementById("q").value.toLowerCase();
 let rows=data.filter(x=>(active==="All"||x[1]===active)&&x[0].toLowerCase().includes(q.split(/\s+/)[0]));
 if(!rows.length) rows=data.filter(x=>active==="All"||x[1]===active);
 document.getElementById("status").textContent=`${rows.length} result${rows.length!==1?'s':''} • ${document.getElementById("q").value}`;
 document.getElementById("results").innerHTML=rows.map(x=>`<div class="card">
   <img class="pic" src="${img}" alt="">
   <div><div class="title">${x[0]}</div><div class="storeline">${x[1]}</div><div class="price">${x[2]}</div><div class="rating">★ ${x[3]}</div><div class="stock">${x[4]}</div></div>
   <a class="view" href="${x[5]}" target="_blank" rel="noopener">View</a>
 </div>`).join("");
}
renderStores();search();
</script>
</body>
</html>
